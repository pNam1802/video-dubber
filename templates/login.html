{% extends "auth_layout.html" %}
{% block title %}Đăng nhập · Nora{% endblock %}

{% block form %}
<form method="post" class="space-y-lg" data-busy-label="Đang đăng nhập...">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="space-y-xs">
    <label class="field-label" for="username">
      Tên đăng nhập
    </label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username"
      placeholder="Nhập tên đăng nhập"
      class="input py-2.5">
  </div>

  <div class="space-y-xs">
    <label class="field-label flex justify-between" for="password">
      Mật khẩu
    </label>
    <div class="relative">
      <input id="password" name="password" type="password" required autocomplete="current-password"
        placeholder="Nhập mật khẩu"
        class="input py-2.5 pr-12">
      <button type="button" data-toggle-password="password" aria-label="Hiện hoặc ẩn mật khẩu"
        class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined">visibility_off</span>
      </button>
    </div>
  </div>

  <button type="submit"
    class="btn-primary w-full py-3 mt-md text-body-lg">
    Đăng nhập
  </button>

  <p class="text-center text-body-md font-body-md text-on-surface-variant">
    Chưa có tài khoản?
    <a href="{{ url_for('auth.register') }}" class="text-primary hover:underline">Đăng ký ngay</a>
  </p>
</form>
{% endblock %}
