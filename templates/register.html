{% extends "auth_layout.html" %}
{% block title %}Đăng ký · Nora{% endblock %}

{% block form %}
<form method="post" class="space-y-lg" data-busy-label="Đang tạo tài khoản..." id="registerForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="space-y-xs">
    <label class="block text-label-sm font-label-sm uppercase text-on-surface-variant" for="username">
      Tên đăng nhập
    </label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username" minlength="3"
      placeholder="Chọn một tên đăng nhập"
      class="w-full bg-background border border-outline-variant px-md py-sm text-body-md font-body-md text-on-surface placeholder-outline rounded-none focus:border-primary-container focus:outline-none transition-colors">
  </div>

  <div class="space-y-xs">
    <label class="block text-label-sm font-label-sm uppercase text-on-surface-variant" for="email">
      Email <span class="normal-case text-on-surface-variant/70">(không bắt buộc)</span>
    </label>
    <input id="email" name="email" type="email" autocomplete="email"
      placeholder="Để nhận thông báo khi job xong/lỗi"
      class="w-full bg-background border border-outline-variant px-md py-sm text-body-md font-body-md text-on-surface placeholder-outline rounded-none focus:border-primary-container focus:outline-none transition-colors">
  </div>

  <div class="space-y-xs">
    <label class="block text-label-sm font-label-sm uppercase text-on-surface-variant" for="password">
      Mật khẩu
    </label>
    <div class="relative">
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8"
        placeholder="Tối thiểu 8 ký tự"
        class="w-full bg-background border border-outline-variant px-md py-sm pr-12 text-body-md font-body-md text-on-surface placeholder-outline rounded-none focus:border-primary-container focus:outline-none transition-colors">
      <button type="button" data-toggle-password="password" aria-label="Hiện hoặc ẩn mật khẩu"
        class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined">visibility_off</span>
      </button>
    </div>

    <div class="flex gap-1 pt-1">
      {% for i in range(3) %}
      <div class="strength-bar h-1 flex-1 bg-surface-container-high transition-colors"></div>
      {% endfor %}
    </div>
    <p id="strengthText" class="text-label-sm font-label-sm text-on-surface-variant">Tối thiểu 8 ký tự</p>
  </div>

  <div class="space-y-xs">
    <label class="block text-label-sm font-label-sm uppercase text-on-surface-variant" for="passwordConfirm">
      Nhập lại mật khẩu
    </label>
    <input id="passwordConfirm" type="password" required autocomplete="new-password" placeholder="Nhập lại mật khẩu"
      class="w-full bg-background border border-outline-variant px-md py-sm text-body-md font-body-md text-on-surface placeholder-outline rounded-none focus:border-primary-container focus:outline-none transition-colors">
    <p id="matchText" class="hidden text-label-sm font-label-sm text-error">Hai mật khẩu chưa khớp.</p>
  </div>

  <button type="submit"
    class="w-full bg-primary-container text-on-primary-container text-body-lg font-headline-md font-bold py-md mt-md hover:bg-primary transition-colors rounded-none border border-transparent">
    Tạo tài khoản
  </button>

  <p class="text-center text-body-md font-body-md text-on-surface-variant">
    Đã có tài khoản?
    <a href="{{ url_for('auth.login') }}" class="text-primary hover:underline">Đăng nhập</a>
  </p>
</form>

<script>
  (function () {
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirm = document.getElementById("passwordConfirm");
    const bars = document.querySelectorAll(".strength-bar");
    const strengthText = document.getElementById("strengthText");
    const matchText = document.getElementById("matchText");

    const LEVELS = [
      ["Quá ngắn — tối thiểu 8 ký tự", "bg-error"],
      ["Tạm được", "bg-tertiary"],
      ["Mạnh", "bg-primary"]
    ];

    function score(value) {
      if (value.length < 8) return 0;
      let variety = 0;
      if (/[a-z]/.test(value) && /[A-Z]/.test(value)) variety++;
      if (/\d/.test(value)) variety++;
      if (/[^\w\s]/.test(value)) variety++;
      return value.length >= 12 && variety >= 2 ? 2 : 1;
    }

    password.addEventListener("input", function () {
      const level = score(password.value);
      const [text, colour] = LEVELS[level];
      bars.forEach(function (bar, i) {
        bar.className = "strength-bar h-1 flex-1 transition-colors " +
          (password.value && i <= level ? colour : "bg-surface-container-high");
      });
      strengthText.textContent = password.value ? text : "Tối thiểu 8 ký tự";
    });

    // Chặn ở client cho nhanh; backend vẫn là nơi kiểm tra thật.
    form.addEventListener("submit", function (e) {
      if (password.value !== confirm.value) {
        e.preventDefault();
        matchText.classList.remove("hidden");
        confirm.focus();
      }
    });
    confirm.addEventListener("input", function () { matchText.classList.add("hidden"); });
  })();
</script>
{% endblock %}
